<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TG 群聊记录查看器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="group-icon" id="groupIcon">
                    <span id="groupIconText">？</span>
                </div>
                <div class="group-info">
                    <h1 id="groupName">加载中...</h1>
                    <p id="groupMeta"></p>
                </div>
                <button class="theme-toggle" id="themeToggle" title="切换主题">
                    <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                        <path d="M12 7a5 5 0 100 10 5 5 0 000-10zM12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
                    </svg>
                    <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                        <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
                    </svg>
                </button>
            </div>

            <div class="search-box">
                <input type="text" id="searchInput" placeholder="搜索消息内容..." />
                <button class="search-btn" id="searchBtn">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                        <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
                        <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </button>
            </div>

            <div class="filter-bar">
                <button class="filter-btn active" data-filter="all">全部</button>
                <button class="filter-btn" data-filter="message">消息</button>
                <button class="filter-btn" data-filter="service">系统</button>
                <button class="filter-btn" data-filter="sticker">贴纸</button>
            </div>

            <div class="stats-panel" id="statsPanel">
                <h3>📊 统计信息</h3>
                <div class="stat-item">
                    <span class="stat-label">总消息数</span>
                    <span class="stat-value" id="statTotal">-</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">普通消息</span>
                    <span class="stat-value" id="statMessage">-</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">服务消息</span>
                    <span class="stat-value" id="statService">-</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">活跃用户</span>
                    <span class="stat-value" id="statUsers">-</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">时间范围</span>
                    <span class="stat-value" id="statRange">-</span>
                </div>
            </div>

            <div class="user-list" id="userList">
                <h3>👥 活跃用户</h3>
                <div class="user-list-content" id="userListContent"></div>
            </div>
        </aside>

        <main class="chat-container">
            <header class="chat-header">
                <div class="chat-title">
                    <h2 id="chatTitle">聊天记录</h2>
                    <p id="chatSubtitle"></p>
                </div>
                <div class="chat-actions">
                    <button class="action-btn" id="scrollBottom" title="滚到底部">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                            <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/>
                        </svg>
                    </button>
                    <button class="action-btn" id="scrollTop" title="滚到顶部">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                            <path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/>
                        </svg>
                    </button>
                </div>
            </header>

            <div class="chat-messages" id="chatMessages">
                <div class="loading-state" id="loadingState">
                    <div class="spinner"></div>
                    <p>正在加载聊天记录...</p>
                </div>
            </div>

            <footer class="chat-footer">
                <div class="message-counter" id="messageCounter">0 条消息</div>
                <div class="progress-bar" id="progressBar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </footer>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
